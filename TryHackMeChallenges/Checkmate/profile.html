}

<body class="bg-light">

            </div>

          </div>

          <div class="fw-semibold">Active employee</div>

            </div>
            <div class="col-md-6">

              <div class="fw-semibold">marky</div>

              <div class="fw-semibold">14021995</div>
            </div>
          </div>
        </div>

          <div class="fw-semibold mb-2">Actions</div>
          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-outline-secondary" onclick="inert(event)">Edit Profile</button>

<script src="Employee%20Profile%20-%20Engineering%20Careers_files/bootstrap.bundle.min_LMWD.js"></script>
<script>
function inert(e){
  if (e) e.preventDefault();
  const t = bootstrap.Toast.getOrCreateInstance(document.getElementById('toast'));
  t.show();
}
</script>

<div class="position-fixed bottom-0 end-0 p-3" style="z-index:1080">
  <div id="toast" class="toast">
    <div class="toast-header">
      <strong class="me-auto">Engineering Careers</strong>
      <small class="text-secondary">demo</small>
      <button class="btn-close" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body">Disabled in the lab demo.</div>
  </div>
